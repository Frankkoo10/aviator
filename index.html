<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Aviador - En Vivo</title>
    <link rel="stylesheet" href="estilos.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app">

    <a href="https://frankkoo10.github.io/casinou/" class="top-logo">
        <img src="logo.png" alt="V Logo" />
    </a>

        <!-- Indicador de jugadores en línea -->
        <div class="online-indicator">
            <span class="dot"></span> <span id="online-count-value">1</span> Jugador(es)
        </div>

        <br><br>
        <div id="history-bar" class="history-bar"></div>

        <div class="balance-container">
            Créditos: $<span id="balance-amount">CARGANDO...</span>
        </div>
        
        <h1>Aviator</h1>

       <div class="flight-zone" id="flight-zone">
            <canvas id="trail-canvas"></canvas>

            <div id="multiplier-display" class="multiplier">1.00x</div>
            <div id="airplane" class="airplane">
                <img id="airplane-img" src="avion.png" alt="Avión" class="airplane-img">
            </div>
        </div>

        <div class="controls-panel">
            <div id="betting-section">
                <div class="chips-selector" id="chips-container">
                    <div class="chip chip-100" onclick="sumarApuesta(100)">
                        <div class="chip-inner">100</div>
                    </div>
                    <div class="chip chip-250" onclick="sumarApuesta(250)">
                        <div class="chip-inner">250</div>
                    </div>
                    <div class="chip chip-500" onclick="sumarApuesta(500)">
                        <div class="chip-inner">500</div>
                    </div>
                    <div class="chip chip-1000" onclick="sumarApuesta(1000)">
                        <div class="chip-inner">1K</div>
                    </div>
                    <div class="chip chip-5000" onclick="sumarApuesta(5000)">
                        <div class="chip-inner">5K</div>
                    </div>
                </div>

                <div class="bet-actions">
                    <div class="current-bet-display">Apuesta: $<span id="bet-amount">0</span></div>
                    <button id="btn-clear" onclick="limpiarApuesta()">Limpiar</button>
                    <button id="btn-despegar" onclick="registrarApuestaJugador()">Apostar</button>
                </div>
            </div>

            <button id="btn-retirarse" onclick="retirarse()" disabled>¡COBRAR!</button>
        </div>

        <div id="message" class="message">Verificando sesión y sincronizando servidor...</div>

        <!-- NUEVO: Botón Flotante para el Chat -->
        <button id="chat-toggle-btn" class="chat-toggle-btn" onclick="toggleChat()">
            💬 Chat
        </button>

        <!-- NUEVO: Contenedor del Chat en Vivo (Flotante) -->
        <div id="chat-popup" class="chat-popup">
            <div class="chat-header">
                <span>Chat en Vivo</span>
                <button class="chat-close-btn" onclick="toggleChat()">✖</button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-group">
                <input type="text" id="chat-input" placeholder="Escribe un mensaje..." onkeypress="manejarEnterChat(event)" autocomplete="off">
                <button id="btn-send-chat" onclick="enviarMensajeChat()">Enviar</button>
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
